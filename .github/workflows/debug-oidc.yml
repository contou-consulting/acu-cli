name: debug-oidc

# Temporary: prints the decoded GitHub OIDC token claims (no signature/secret) so we can
# compare them against the trusted-publisher registration on nuget.org. Safe to delete.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print decoded OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            const [, payload] = token.split('.');
            const claims = JSON.parse(Buffer.from(payload, 'base64').toString());
            console.log(JSON.stringify(claims, null, 2));
