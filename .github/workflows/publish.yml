name: publish

# Publishes the acu-cli .NET tool to nuget.org when a version tag (v1.2.3) is pushed.
# Authentication uses NuGet trusted publishing (GitHub OIDC federation) — no API key
# secret. The trusted publisher on nuget.org must be registered for package ID
# Contou.AcuCli with this repository and workflow path (.github/workflows/publish.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive the package version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack acu-cli --no-build -c Release -o dist -p:Version="$VERSION"

      - name: Push to nuget.org (trusted publishing)
        run: >
          dotnet nuget push dist/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
