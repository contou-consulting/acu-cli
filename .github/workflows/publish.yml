name: publish

# Publishes the acu-cli .NET tool to nuget.org when a version tag (v1.2.3) is pushed,
# using trusted publishing (no long-lived API key):
#   1. NuGet/login@v1 exchanges the GitHub OIDC token for a 1-hour nuget.org API key
#   2. dotnet nuget push uses that temporary key
# Setup on nuget.org (Account Settings > Trusted Publishing) and GitHub:
#   - Trusted-publisher policy: owner `contou-consulting`, repository `acu-cli`,
#     workflow file `publish.yml` (file name only), environment `nuget` (or blank)
#   - Repo secret NUGET_USER: your nuget.org profile name (username, not email)
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget   # must match the trusted-publisher policy on nuget.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive the package version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack acu-cli --no-build -c Release -o dist -p:Version="$VERSION"

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push dist/*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
