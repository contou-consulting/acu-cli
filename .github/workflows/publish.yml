name: publish

# Publishes the acu-cli .NET tool to nuget.org when a version tag (v1.2.3) is pushed.
# Requires the NUGET_API_KEY secret (nuget.org > your account > API Keys).
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive the package version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack acu-cli --no-build -c Release -o dist -p:Version="$VERSION"

      - name: Push to nuget.org
        run: >
          dotnet nuget push dist/*.nupkg
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
